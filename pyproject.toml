[project]
name = "livekit-voice-assistant"
version = "0.1.0"
# 3.13 segfaults inside livekit's FFI (liblivekit_ffi SIGSEGV); bound it out
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[elevenlabs,groq,simli,sarvam,tavus,google,openai]~=1.8",
    # imported directly by backend/token/app.py; declared rather than relied on as a
    # transitive dep of livekit-agents
    "livekit-api~=1.2",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ddgs>=9.0",
    "httpx>=0.27",
    "google-genai>=2.0",
]

[tool.uv]
# this repo is an app, not an installable package: `uv sync` must never try to build it
package = false

