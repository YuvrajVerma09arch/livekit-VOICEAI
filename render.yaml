# Render Blueprint - deploys the two long-running pieces of this app:
#   1. kilos-token-server  (web)      - FastAPI /token endpoint, /healthz for checks
#   2. kilos-agent         (worker)   - the LiveKit agent worker (backend/agent)
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Secrets are prompted for on the Blueprint setup screen (sync: false).
# After the web service is up, put its URL into frontend/vercel.json (rewrites).

services:
  - type: web
    name: kilos-token-server
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn backend.token.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # shared secret the frontend must send to /token; unset fails closed (500)
      - key: APP_PASSWORD
        sync: false
      # comma-separated browser origins allowed to call /token (e.g. your Vercel URL);
      # leave unset to fall back to the same-host check
      - key: TOKEN_ALLOWED_ORIGINS
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: SIMLI_AVATAR_ID
        sync: false
      # - key: TOKEN_RATE_LIMIT
      #   value: "10"

  - type: worker
    name: kilos-agent
    runtime: python
    # background workers have no free tier; 0.5c-512mb is the smallest plan
    plan: 0.5c-512mb
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m backend.agent start
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: SIMLI_AVATAR_ID
        sync: false
      # avatar fallback chain; unset = auto-detect from whichever keys are present
      - key: AVATAR_PROVIDER
        sync: false
      - key: TAVUS_API_KEY
        sync: false
      # TTS provider: "sarvam" (managed API), "kokoro" (self-hosted), "elevenlabs"
      - key: TTS_PROVIDER
        sync: false
      # URL of the kokoro-tts service; only used when TTS_PROVIDER=kokoro
      - key: KOKORO_TTS_URL
        sync: false
      # - key: SIMLI_JOIN_TIMEOUT
      #   value: "15"
